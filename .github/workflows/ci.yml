name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run from the Actions tab on main: test, then release.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests take minutes; a stuck run fails at this instead of after GitHub's six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The tools mise.toml names, as on a developer's machine: .NET at global.json's version.
      - uses: jdx/mise-action@v5
      - run: dotnet build -c Release
      - run: dotnet test tests/DacDeploy.UnitTests -c Release --no-build
      # SQL Server runs in Docker, through Testcontainers.
      - run: dotnet test tests/DacDeploy.IntegrationTests -c Release --no-build

  release:
    # semantic-release picks the version from the commits since the last release (.releaserc.json), tags it, publishes
    # both packages to nuget.org and writes the GitHub release; with no fix or feature since, it releases nothing.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The tag and the GitHub release, and comments on the issues and pull requests it ships.
      contents: write
      issues: write
      pull-requests: write
      # nuget.org trusted publishing: a short-lived key for this run, instead of a stored one.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit and tag since the last release.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p conventional-changelog-conventionalcommits@10.4.1
          semantic-release
